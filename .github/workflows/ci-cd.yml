name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Prenos kode
        uses: actions/checkout@v4

      - name: Namestitev Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Namestitev odvisnosti
        run: npm ci

      - name: Biome lint
        run: npm run lint