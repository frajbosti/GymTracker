name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Prenos kode
        uses: actions/checkout@v4

      - name: Namestitev Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Namestitev odvisnosti
        run: npm ci

      - name: Biome lint
        run: npm run lint

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Prenos kode
        uses: actions/checkout@v4

      - name: Namestitev Node.js (s predpomnilnikom npm)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Namestitev odvisnosti
        run: npm ci

      - name: Generiranje Prisma Clienta
        run: npm run db:generate

      - name: Gradnja frontenda in backenda
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'http://localhost:3000' }}

      - name: Shrani frontend (dist)
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Shrani backend (dist + prisma)
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: |
            backend/dist
            backend/prisma
            backend/package.json
            package-lock.json