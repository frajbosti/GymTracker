name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Prenos kode
        uses: actions/checkout@v5

      - name: Namestitev Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Namestitev odvisnosti
        run: npm ci

      - name: Biome lint
        run: npm run lint

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Prenos kode
        uses: actions/checkout@v5

      - name: Namestitev Node.js (s predpomnilnikom npm)
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Namestitev odvisnosti
        run: npm ci

      - name: Generiranje Prisma Clienta
        run: npm run db:generate

      - name: Gradnja frontenda in backenda
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'http://localhost:3000' }}

      - name: Shrani frontend (dist)
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Shrani backend (dist + prisma)
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: |
            backend/dist
            backend/prisma
            backend/package.json
            backend/Dockerfile
            frontend/package.json
            package.json
            package-lock.json

  test:
    name: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gymtracker
          POSTGRES_PASSWORD: gymtracker
          POSTGRES_DB: gymtracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gymtracker -d gymtracker_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://gymtracker:gymtracker@localhost:5432/gymtracker_test?schema=public
    steps:
      - name: Prenos kode
        uses: actions/checkout@v5

      - name: Namestitev Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Namestitev odvisnosti
        run: npm ci

      - name: Generiranje Prisma Clienta
        run: npm run db:generate

      - name: Testi s pokritostjo (frontend in backend)
        run: npm run test:coverage

      - name: Migracije testne baze
        run: npm run db:migrate -w backend
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Integracijski testi backenda (PostgreSQL)
        run: npm run test:integration -w backend

      - name: Shrani poročilo o pokritosti
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            frontend/coverage
            backend/coverage

  deploy:
    name: deploy
    needs: [lint, build, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/gymtracker-backend
    steps:
      - name: Prenos artefakta frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist

      - name: Namestitev frontenda na Netlify
        run: npx --yes netlify-cli deploy --dir=frontend-dist --prod --no-build
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Prenos artefakta backend
        uses: actions/download-artifact@v4
        with:
          name: backend-dist
          path: backend-paket

      - name: Prijava v GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Zapakiraj backend v Docker sliko in jo objavi
        working-directory: backend-paket
        run: |
          docker build -f backend/Dockerfile -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest
